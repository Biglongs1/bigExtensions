name: Source request
description: Ask for a new manga source to be added
title: "[Request]: "
labels: ["source request"]
body:
  - type: input
    id: name
    attributes:
      label: Source name
      placeholder: Example Scans
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Source URL
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      placeholder: pt-BR
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything worth knowing
      description: Login requirement, paid chapters, mirrors, obfuscated readers, or how often the site changes.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched the existing issues and this source has not been requested before.
          required: true
        - label: This source is not already available in [keiyoushi](https://github.com/keiyoushi/extensions).
          required: true
        - label: Reading on this site does not require a paid account.
          required: true
